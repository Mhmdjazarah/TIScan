# TIScan scheduled monitoring on GitHub Actions: free, and it keeps running while your computer is off.
#
# Put this file at .github/workflows/tiscan-monitor.yml in a PRIVATE repository, next to a
# watchlist.txt file. The repository stores your watchlist and what TIScan has already seen,
# so keep it private. Setup steps: https://github.com/Mhmdjazarah/TIScan#247-monitoring-with-github-actions-free
name: TIScan monitor

on:
  schedule:
    - cron: "0 5 * * *"      # every day at 05:00 UTC (08:00 in Jordan). GitHub may start it a little late.
  workflow_dispatch:          # adds a "Run workflow" button for manual runs

permissions:
  contents: write             # needed to save state/monitor-state.json back to this repository

concurrency:
  group: tiscan-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get watchlist and saved state
        uses: actions/checkout@v7

      - name: Get TIScan
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.TISCAN_REPO || 'Mhmdjazarah/TIScan' }}
          path: tiscan-src

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tiscan-src/requirements.txt

      - name: Install
        run: pip install -r tiscan-src/requirements.txt

      - name: Check watchlist and send email
        working-directory: tiscan-src
        env:
          TISCAN_DB: ${{ runner.temp }}/tiscan.db
          TISCAN_ALERT_LINKS: "false"
          RANSOMWARE_BACKGROUND_REFRESH: "false"
          MONITOR_DAILY_REPORT: ${{ vars.DAILY_REPORT || 'true' }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_SECURITY: ${{ vars.SMTP_SECURITY || 'starttls' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
          ABUSECH_API_KEY: ${{ secrets.ABUSECH_API_KEY }}
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
          GREYNOISE_API_KEY: ${{ secrets.GREYNOISE_API_KEY }}
          PULSEDIVE_API_KEY: ${{ secrets.PULSEDIVE_API_KEY }}
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
          HIBP_API_KEY: ${{ secrets.HIBP_API_KEY }}
        run: python -m tiscan monitor --watchlist-file ../watchlist.txt --state ../state/monitor-state.json

      - name: Save what TIScan has already seen
        if: always()
        run: |
          [ -f state/monitor-state.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/monitor-state.json
          git diff --cached --quiet && exit 0
          git commit -m "monitor state $(date -u +%Y-%m-%d)"
          git push
